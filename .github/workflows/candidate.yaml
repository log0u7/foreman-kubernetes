name: Candidate image test

# Validates a candidate Foreman image (6admin.io release mirror on GHCR)
# against the minimal chart with the disposable kind cluster. Same flow
# as the upstream chart tests, with an image override so a released
# image tag can be validated before consuming it in production.

on:
  workflow_dispatch:
    inputs:
      image_repository:
        description: Image repository to test
        default: ghcr.io/log0u7/foreman
      image_tag:
        description: Image tag to test
        required: true
  schedule:
    # Nightly: validate the GHCR latest mirror against the chart head.
    - cron: '30 2 * * *'

permissions:
  contents: read
  packages: read

jobs:
  test:
    name: Foreman Installation (candidate)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      HELM_IMAGE_REPOSITORY: ${{ inputs.image_repository || 'ghcr.io/log0u7/foreman' }}
      HELM_IMAGE_TAG: ${{ inputs.image_tag || 'latest' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: azure/setup-helm@bf6a7d304bc2fdb57e0331155b7ebf2c504acf0a # v4
        with:
          version: v4.3.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: helm/kind-action@0b5c88445f37b7e12a2ce1ecca7805b9046a74db # v1
        with:
          install_only: true
          version: v0.33.0
          kubectl_version: v1.34.1
      - name: Install test dependencies
        run: make setup-test-env
      - name: Create Kind cluster
        run: sudo --preserve-env=PATH make setup-kind
      - name: Test Foreman installation
        run: sudo --preserve-env=PATH,HELM_IMAGE_REPOSITORY,HELM_IMAGE_TAG make test
      - name: Installation diagnostics
        if: failure()
        run: sudo --preserve-env=PATH make diagnostics
      - name: Remove Kind cluster
        if: always()
        run: sudo --preserve-env=PATH make teardown-kind
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: foreman-candidate-test-results
          path: artifacts/junit.xml
          if-no-files-found: warn
